server:
  port: 8080

spring:
  application:
    name: plethora-tpo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plethora_tpo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-this-needs-to-be-long-enough-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    email: ${ADMIN_EMAIL:admin@plethora.local}
    password: ${ADMIN_PASSWORD:Admin@123}
  invite-codes:
    tpo: ${TPO_INVITE_CODE:tpo-invite-dev-only}
