services:
  - type: web
    name: plethora-tpo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Full JDBC URL from your managed MySQL provider (Render has no managed MySQL;
      # use Aiven, PlanetScale, Railway MySQL, etc), e.g.:
      # jdbc:mysql://<DB_HOST>:<DB_PORT>/<DB_NAME>?useSSL=true&requireSSL=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed frontend origins, e.g. the frontend
      # service URL below once it's known: https://plethora-tpo-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TPO_INVITE_CODE
        sync: false

  - type: web
    name: plethora-tpo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set to the backend service's public URL + /api once it's deployed,
      # e.g. https://plethora-tpo-backend.onrender.com/api. Changing this
      # requires a rebuild since Vite inlines VITE_* vars at build time.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
