databases:
  - name: plethora-tpo-db
    plan: free
    databaseName: plethora_tpo
    user: plethora_tpo

services:
  - type: web
    name: plethora-tpo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render's Postgres `connectionString` property is a postgres:// URI, not a JDBC
      # URL, so the JDBC URL is built from the individual host/port/database properties
      # instead (see application.yml, which assembles jdbc:postgresql://${DB_HOST}:...).
      - key: DB_HOST
        fromDatabase:
          name: plethora-tpo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: plethora-tpo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: plethora-tpo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: plethora-tpo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: plethora-tpo-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed frontend origins, e.g. the frontend
      # service URL below once it's known: https://plethora-tpo-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TPO_INVITE_CODE
        sync: false

  - type: web
    name: plethora-tpo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set to the backend service's public URL + /api once it's deployed,
      # e.g. https://plethora-tpo-backend.onrender.com/api. Changing this
      # requires a rebuild since Vite inlines VITE_* vars at build time.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
